name: CI + Release

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

  push:
    branches:
      - "**"   # 所有 branch

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================
  # CI（所有分支 / PR）
  # ======================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      # ======================
      # CHECKOUT
      # ======================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================
      # SETUP NODE
      # ======================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # ======================
      # INSTALL
      # ======================
      - name: Install
        run: yarn install --frozen-lockfile

      # ======================
      # LINT
      # ======================
      - name: Lint
        run: yarn exec eslint .

      # ======================
      # BUILD
      # ======================
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_API_ENDPOINT: ${{ vars.NEXT_PUBLIC_API_ENDPOINT }}
          NEXT_PUBLIC_AGGRID_LICENSE: ${{ secrets.NEXT_PUBLIC_AGGRID_LICENSE }}

      # ======================
      # COMMITLINT（PR only new commits）
      # ======================
      - name: Commitlint (commits)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          npx commitlint --from $BASE --to HEAD

      # ======================
      # COMMITLINT（PR title）
      # ======================
      - name: Commitlint (PR title)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          echo "${{ github.event.pull_request.title }}" | npx commitlint


  # ======================
  # RELEASE（仅 main）
  # ======================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ======================
      # CHECKOUT
      # ======================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================
      # SETUP NODE
      # ======================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ======================
      # INSTALL
      # ======================
      - name: Install
        run: yarn install --frozen-lockfile

      # ======================
      # SEMANTIC RELEASE
      # ======================
      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}