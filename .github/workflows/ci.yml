name: CI + Release

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ======================
  # CI（所有分支 / PR）
  # ======================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn exec eslint .

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_API_ENDPOINT: ${{ vars.NEXT_PUBLIC_API_ENDPOINT }}
          NEXT_PUBLIC_AGGRID_LICENSE: ${{ secrets.NEXT_PUBLIC_AGGRID_LICENSE }}

  # ======================
  # COMMITLINT（PR only new commits）
  # ======================
  commitlint:
    name: Commitlint (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      # ======================
      # COMMIT LINT (ONLY NEW COMMITS)
      # ======================
      - name: Commitlint (PR commits)
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)

          git log $BASE..HEAD --pretty=format:"%s" | while read msg; do
            echo "$msg" | npx commitlint
          done

      # ======================
      # PR TITLE CHECK
      # ======================
      - name: Commitlint (PR title)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          echo "${{ github.event.pull_request.title }}" | npx commitlint


  # ======================
  # RELEASE（仅 main）
  # ======================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, commitlint]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: yarn install --frozen-lockfile

      # ======================
      # SEMANTIC RELEASE
      # ======================
      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ======================
      # GET VERSION (from package.json)
      # ======================
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT